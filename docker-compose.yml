services:
  tmserver:
    build:
      context: .
    container_name: tmserver
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-2350}:2350/tcp"
      - "${SERVER_PORT:-2350}:2350/udp"
      - "${SERVER_P2P_PORT:-3450}:3450/tcp"
      - "${SERVER_XMLRPC_PORT:-5000}:5000/tcp"
      - "80:80/tcp"
    env_file:
      - .env
    volumes:
      - ./data/GameData:/opt/tmserver/GameData
    networks:
      tmserver_net:
        ipv4_address: 172.20.60.10

networks:
  tmserver_net:
    name: tmserver.dockernetwork.local
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.60.0/25
          gateway: 172.20.60.1
          ip_range: 172.20.60.64/26
